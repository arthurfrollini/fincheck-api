name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # Mirrors .husky/pre-push exactly (lint -> tsc -> prettier -> test), so
    # a green PR check means the same thing a passing local push already did.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: fincheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # env.ts validates every one of these at import time, and
      # global-setup.ts/create-app.ts load them from an actual .env.test
      # file (not just process.env) — same shape as the local dev file,
      # all fake values, never used for a real network call.
      - name: Write .env.test
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL="postgresql://root:root@localhost:5432/fincheck_test?schema=public"
          JWT_SECRET=test-jwt-secret
          RESEND_API_KEY=fake-resend-key
          RESEND_FROM_EMAIL=test@test.com
          GOOGLE_CLIENT_ID=fake-google-client-id
          GOOGLE_CLIENT_SECRET=fake-google-client-secret
          GOOGLE_CALLBACK_URL=http://localhost:3000/auth/google/callback
          AWS_REGION=us-east-1
          AWS_ACCESS_KEY_ID=fake-access-key
          AWS_SECRET_ACCESS_KEY=fake-secret-key
          AWS_S3_BUCKET_NAME=fake-bucket
          STRIPE_SECRET_KEY=sk_test_fake
          STRIPE_WEBHOOK_SECRET=whsec_fake
          STRIPE_PRICE_GOLD=price_gold_fake
          STRIPE_PRICE_PLATINUM=price_platinum_fake
          REDIS_HOST=localhost
          REDIS_PORT=6379
          EOF

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Format check
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Test (unit + e2e, merged coverage)
        run: npm test
