name: Evals

# Real-model evals: they call the Claude API, cost money and vary run to run,
# so they stay out of the main CI pipeline. Never triggered by pull_request:
# the API key must not be exposed to workflows a fork PR can start.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated models (only claude-haiku-5-5 is gated)'
        required: false
        default: 'claude-haiku-5-5'

permissions:
  contents: read

jobs:
  categorization:
    runs-on: ubuntu-latest
    # Worst case (API hanging): 50 cases x 3 attempts x 30s / 5 in flight
    # is ~15 min per model; a two-model comparison needs the headroom.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Run categorization eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELS: ${{ inputs.models || 'claude-haiku-5-5' }}
        run: |
          set -o pipefail
          npm run --silent eval:categorization -- --models "$MODELS" --out eval-result.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: categorization-eval
          path: eval-result.json
          if-no-files-found: ignore

  rag-answers:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: fincheck_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://root:root@localhost:5432/fincheck_eval?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Install poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Cache corpus and embedding model
        uses: actions/cache@v4
        with:
          path: .cache
          key: rag-${{ hashFiles('corpus/manifest.json', 'src/modules/education/infra/embeddings/transformers-embedding.provider.ts') }}

      - run: npx prisma migrate deploy

      - run: npm run --silent rag:ingest

      - name: Run RAG answer eval (Sonnet 5.5 answers, Opus 5.5 judge)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          npm run --silent eval:rag-answers | tee -a "$GITHUB_STEP_SUMMARY"

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # pgvector image: the migrations create the vector extension.
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: fincheck_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://root:root@localhost:5432/fincheck_eval?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy

      - name: Run agent eval (Sonnet 5.5 agent, Opus 5.5 judge)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          npm run --silent eval:agent | tee -a "$GITHUB_STEP_SUMMARY"
