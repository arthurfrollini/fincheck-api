services:
  db:
    image: postgres:17
    container_name: pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: fincheck
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    ports:
      - '5540:5540'
    volumes:
      - redisinsight_data:/data

  jaeger:
    # Jaeger v1 (all-in-one) reached end-of-life 2025-12-31 — v2 is a
    # rearchitecture on the OpenTelemetry Collector and is config-file-only
    # (no more COLLECTOR_OTLP_ENABLED-style env vars). Dark mode is a v2-only
    # UI feature, enabled via config-ui.json below.
    image: jaegertracing/jaeger:2.20.0
    container_name: jaeger
    restart: unless-stopped
    command: ['--config', '/etc/jaeger/config.yaml']
    volumes:
      - ./docker/jaeger/config.yaml:/etc/jaeger/config.yaml
      - ./docker/jaeger/config-ui.json:/etc/jaeger/config-ui.json
    ports:
      - '16686:16686' # UI
      - '4317:4317' # OTLP gRPC receiver
      - '4318:4318' # OTLP HTTP receiver

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'

  loki:
    image: grafana/loki:3.7.6
    container_name: loki
    restart: unless-stopped
    command: ['-config.file=/etc/loki/loki-config.yaml']
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki_data:/loki
    ports:
      - '3100:3100'

  grafana:
    image: grafana/grafana:13.2.0
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - '3001:3000'

volumes:
  postgres_data:
  redis_data:
  redisinsight_data:
  prometheus_data:
  loki_data:
  grafana_data:
