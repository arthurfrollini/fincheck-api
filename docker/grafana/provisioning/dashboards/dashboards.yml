apiVersion: 1

# Dashboards in this folder are loaded at Grafana start-up and re-read every
# 30s, so editing the JSON in the repo updates Grafana without clicks.
providers:
  - name: finwise
    folder: finwise
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
